packages:
    # 域名分层布局下的脚本项目：src/<顶级域>/<二级域>/<项目>
    - 'src/[!.]*/[!.]*/*'
    # 链接库以点开头的目录（.bilibili-api-lib）
    - 'src/[!.]*/[!.]*/.*'
    # 两个特殊目录：跨站脚本与定时脚本
    - 'src/.Global/*'
    - 'src/.Crontab/*'

# 本地实验目录 src/.WIP、模板目录、未入库的孤儿目录都不在 workspace 内

allowBuilds:
    esbuild: true

# 不要在每个 pnpm run/exec 之前自动重装依赖（会重建子项目锁文件）
verifyDepsBeforeRun: false
